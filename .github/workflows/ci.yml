name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    name: Go quality / ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.26.8
          - 1.27.1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          formatted="$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)"
          if [[ -n "$formatted" ]]; then
            printf 'The following Go files are not gofmt-clean:\n%s\n' "$formatted"
            exit 1
          fi

      - name: Verify modules
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          tidy_diff="$(go mod tidy -diff)"
          if [[ -n "$tidy_diff" ]]; then
            printf 'go mod tidy -diff reported changes:\n%s\n' "$tidy_diff"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Enforce total coverage
        run: scripts/check-coverage.sh

      - name: Run race tests
        run: go test -race ./...

      - name: Build all packages
        run: go build ./...

  lint:
    name: Focused static lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  windows:
    name: Windows ownership tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true

      - name: Run native ownership and local-store tests
        run: go test ./internal/fileowner ./internal/registry ./internal/recipepolicy ./internal/trust

  release-config:
    name: Release configuration snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: true

      - name: Test release tag and public smoke failure handling
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-release-tag_test.sh
          bash scripts/release-smoke_test.sh

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check

      - name: Build and smoke-test a snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --snapshot --clean --skip=publish

      - name: Verify snapshot archives
        run: scripts/verify-release-artifacts.sh dist --run-help
