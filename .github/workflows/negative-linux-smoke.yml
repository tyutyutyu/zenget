# Temporary isolated probe; never merge. Production smoke steps and gate dependencies are copied unchanged except the fixture tag/artifact name.
name: 'Isolated negative release gate: linux-smoke'
'on':
  pull_request:
    branches:
    - main
permissions:
  contents: read
  actions: read
env:
  ZENGET_TEST_TAG: v0.0.1
  GOTOOLCHAIN: local
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
    - run: echo "Isolated release gate probe; no production tag or release mutation."
  quality:
    name: Windows ownership tests
    runs-on: windows-latest
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: true
    - name: Run native ownership and local-store tests
      run: go test ./internal/fileowner ./internal/registry ./internal/recipepolicy ./internal/trust
  build:
    name: Transfer unchanged approved build artifact
    needs:
    - validate
    - quality
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: zenget-release-d92f75c5e279fbbc6abd809265c3bc388253ef22
        path: dist
        run-id: 35286621591
        github-token: ${{ github.token }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zenget-negative-${{ github.sha }}
        path: dist/*
        if-no-files-found: error
  verify:
    name: Verify release archives
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Check out tagged source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
    - name: Download release output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: zenget-negative-${{ github.sha }}
        path: dist
    - name: Verify checksums, archive contents, and Linux help
      run: scripts/verify-release-artifacts.sh dist --run-help
  smoke-linux:
    name: Linux amd64 release smoke
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Download release output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: zenget-negative-${{ github.sha }}
        path: dist
    - name: Corrupt only this job isolated archive copy
      shell: bash
      run: printf 'intentional corruption' >> dist/zenget_0.0.1_linux_amd64.tar.gz
    - name: Verify and run Linux amd64 archive
      shell: bash
      run: 'set -euo pipefail

        archive="zenget_${ZENGET_TEST_TAG#v}_linux_amd64.tar.gz"

        expected="$(awk -v asset="$archive" ''$2 == asset || $2 == "*" asset { print tolower($1); exit }'' dist/checksums.txt)"

        actual="$(sha256sum "dist/$archive" | awk ''{print tolower($1)}'')"

        [[ -n "$expected" && "$expected" == "$actual" ]]

        extract="$(mktemp -d)"

        trap ''rm -rf "$extract"'' EXIT

        tar -xzf "dist/$archive" -C "$extract"

        "$extract/zenget" --help >/dev/null

        '
  smoke-macos:
    name: macOS arm64 release smoke
    needs: build
    runs-on: macos-14
    permissions:
      contents: read
    steps:
    - name: Download release output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: zenget-negative-${{ github.sha }}
        path: dist
    - name: Verify and run macOS arm64 archive
      shell: bash
      run: 'set -euo pipefail

        archive="zenget_${ZENGET_TEST_TAG#v}_darwin_arm64.tar.gz"

        expected="$(awk -v asset="$archive" ''$2 == asset || $2 == "*" asset { print tolower($1); exit }'' dist/checksums.txt)"

        actual="$(shasum -a 256 "dist/$archive" | awk ''{print tolower($1)}'')"

        [[ -n "$expected" && "$expected" == "$actual" ]]

        extract="$(mktemp -d)"

        trap ''rm -rf "$extract"'' EXIT

        tar -xzf "dist/$archive" -C "$extract"

        "$extract/zenget" --help >/dev/null

        '
  smoke-windows:
    name: Windows amd64 release smoke
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - name: Download release output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: zenget-negative-${{ github.sha }}
        path: dist
    - name: Verify and run Windows amd64 archive
      shell: pwsh
      run: '$ErrorActionPreference = "Stop"

        $archive = "zenget_$($env:ZENGET_TEST_TAG -replace ''^v'', '''')_windows_amd64.zip"

        $line = Get-Content "dist/checksums.txt" | Where-Object { $_ -match "\s$([regex]::Escape($archive))$" } | Select-Object
        -First 1

        if (-not $line) { throw "checksums.txt does not contain $archive" }

        $expected = ($line -split "\s+")[0].ToLowerInvariant()

        $actual = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()

        if ($expected -ne $actual) { throw "SHA-256 mismatch for $archive" }

        $extract = Join-Path $env:RUNNER_TEMP "zenget-release-smoke"

        Expand-Archive -LiteralPath "dist/$archive" -DestinationPath $extract -Force

        $binary = Join-Path $extract "zenget.exe"

        if (-not (Test-Path -LiteralPath $binary)) { throw "archive does not contain zenget.exe at its root" }

        & $binary --help | Out-Null

        if ($LASTEXITCODE -ne 0) { throw "zenget.exe --help failed with exit code $LASTEXITCODE" }

        '
  attest:
    name: Attest verified artifacts
    needs:
    - verify
    - smoke-linux
    - smoke-macos
    - smoke-windows
    runs-on: ubuntu-24.04
    steps:
    - run: 'echo "::error::Release gate leaked: this isolated sentinel must be skipped"

        exit 1'
  publish:
    name: Create draft GitHub release
    needs:
    - validate
    - verify
    - smoke-linux
    - smoke-macos
    - smoke-windows
    - attest
    runs-on: ubuntu-24.04
    steps:
    - run: 'echo "::error::Release gate leaked: this isolated sentinel must be skipped"

        exit 1'
