name: Weekly security scan

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  govulncheck:
    name: Weekly Go vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: true

      - name: Run pinned govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
