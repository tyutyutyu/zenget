name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    env:
      ZENGET_TRUSTED_GPG_FINGERPRINTS: ${{ vars.ZENGET_TRUSTED_GPG_FINGERPRINTS }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate tag, signature, ancestry, and source version
        run: scripts/verify-release-tag.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      - name: Export validated tag
        id: release
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  quality:
    name: Required CI checks
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  codeql:
    name: Required CodeQL check
    needs: validate
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  build:
    name: Build release archives
    needs:
      - validate
      - quality
      - codeql
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.8
          cache: true

      - name: Build without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean --skip=publish

      - name: Confirm release output exists
        run: test -s dist/checksums.txt

      - name: Transfer release output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenget-release-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify release archives
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download release output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zenget-release-${{ github.sha }}
          path: dist

      - name: Verify checksums, archive contents, and Linux help
        run: scripts/verify-release-artifacts.sh dist --run-help

  smoke-linux:
    name: Linux amd64 release smoke
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download release output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zenget-release-${{ github.sha }}
          path: dist

      - name: Verify and run Linux amd64 archive
        shell: bash
        run: |
          set -euo pipefail
          archive="zenget_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz"
          expected="$(awk -v asset="$archive" '$2 == asset || $2 == "*" asset { print tolower($1); exit }' dist/checksums.txt)"
          actual="$(sha256sum "dist/$archive" | awk '{print tolower($1)}')"
          [[ -n "$expected" && "$expected" == "$actual" ]]
          extract="$(mktemp -d)"
          trap 'rm -rf "$extract"' EXIT
          tar -xzf "dist/$archive" -C "$extract"
          "$extract/zenget" --help >/dev/null

  smoke-macos:
    name: macOS arm64 release smoke
    needs: build
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Download release output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zenget-release-${{ github.sha }}
          path: dist

      - name: Verify and run macOS arm64 archive
        shell: bash
        run: |
          set -euo pipefail
          archive="zenget_${GITHUB_REF_NAME#v}_darwin_arm64.tar.gz"
          expected="$(awk -v asset="$archive" '$2 == asset || $2 == "*" asset { print tolower($1); exit }' dist/checksums.txt)"
          actual="$(shasum -a 256 "dist/$archive" | awk '{print tolower($1)}')"
          [[ -n "$expected" && "$expected" == "$actual" ]]
          extract="$(mktemp -d)"
          trap 'rm -rf "$extract"' EXIT
          tar -xzf "dist/$archive" -C "$extract"
          "$extract/zenget" --help >/dev/null

  smoke-windows:
    name: Windows amd64 release smoke
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download release output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zenget-release-${{ github.sha }}
          path: dist

      - name: Verify and run Windows amd64 archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "zenget_$($env:GITHUB_REF_NAME -replace '^v', '')_windows_amd64.zip"
          $line = Get-Content "dist/checksums.txt" | Where-Object { $_ -match "\s$([regex]::Escape($archive))$" } | Select-Object -First 1
          if (-not $line) { throw "checksums.txt does not contain $archive" }
          $expected = ($line -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "SHA-256 mismatch for $archive" }
          $extract = Join-Path $env:RUNNER_TEMP "zenget-release-smoke"
          Expand-Archive -LiteralPath "dist/$archive" -DestinationPath $extract -Force
          $binary = Join-Path $extract "zenget.exe"
          if (-not (Test-Path -LiteralPath $binary)) { throw "archive does not contain zenget.exe at its root" }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "zenget.exe --help failed with exit code $LASTEXITCODE" }

  attest:
    name: Attest verified artifacts
    needs:
      - verify
      - smoke-linux
      - smoke-macos
      - smoke-windows
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download verified release output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zenget-release-${{ github.sha }}
          path: dist

      - name: Attach build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  publish:
    name: Create draft GitHub release
    needs:
      - validate
      - verify
      - smoke-linux
      - smoke-macos
      - smoke-windows
      - attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download verified release output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zenget-release-${{ github.sha }}
          path: dist

      - name: Verify checksums again after transfer
        run: scripts/verify-release-artifacts.sh dist --run-help

      - name: Create or update the draft only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name 'checksums.txt' \) -print | sort)
          if [[ "${#assets[@]}" -ne 6 ]]; then
            printf 'Expected five archives and checksums.txt, found %s files\n' "${#assets[@]}"
            exit 1
          fi

          if existing_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$existing_draft" != "true" ]]; then
              echo "A published release already exists for $RELEASE_TAG; refusing to mutate immutable assets."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "zenget $RELEASE_TAG" \
              --generate-notes
          fi
